<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mapa Brasília - Positron</title>
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
  <style>
    body { margin: 0; padding: 0; overflow: hidden; }
    #map { position: absolute; top: 0; bottom: 0; width: 100%; }
  </style>
</head>
<body>
  <div id="map"></div>
  <script>
    const map = new maplibregl.Map({
      container: 'map',
      //style: 'https://tiles.openfreemap.org/styles/positron', // Tema Positron
      style: 'https://api.maptiler.com/maps/toner-v2/style.json?key=OirAeys66HpijFsXiu8s',
      center: [-47.8825, -15.7942], // Coordenadas de Brasília
      zoom: 11,
      interactive: true // Garante que o clique, arraste e zoom funcionem
    });
    
    // Adiciona os botões de zoom in/out no canto da tela
    map.addControl(new maplibregl.NavigationControl());
  </script>
</body>
</html>
