<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Mapa Interativo - Apresentação</title>
  <!-- Bibliotecas do MapLibre -->
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
  <style>
    /* Remove as margens para o mapa ocupar 100% do slide */
    body { margin: 0; padding: 0; overflow: hidden; }
    #map { width: 100vw; height: 100vh; }
  </style>
</head>
<body>
  <div id="map"></div>
  <script>
    const map = new maplibregl.Map({
      container: 'map',
      // Estilo escuro (linhas brancas/fundo preto):
      style: 'https://tiles.openfreemap.org/styles/dark-matter', 
      
      // Se preferir o estilo claro, troque a linha acima por:
      // style: 'https://tiles.openfreemap.org/styles/positron',
      
      center: [-47.88, -15.79], // Coordenadas de início
      zoom: 10.5
    });
    
    // Adiciona controles de zoom no canto
    map.addControl(new maplibregl.NavigationControl());
  </script>
</body>
</html>
